      security:
      - bearerAuth: []
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^repo_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          example: repo_01934f5a-8b9c-7def-b012-3456789abcde
        description: Repository identifier
      responses:
        '200':
          description: Ledger already exists
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - repo_url
                properties:
                  status:
                    type: string
                    example: ready
                  repo_url:
                    type: string
                    format: uri
                    example: http://localhost:8929/groups/team-abc123/projects/ledger-repo-abc123
                  message:
                    type: string
                    example: Ledger repository already exists
        '201':
          description: Ledger repository created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - repo_url
                properties:
                  status:
                    type: string
                    example: ready
                  repo_url:
                    type: string
                    format: uri
                    example: http://localhost:8929/groups/team-abc123/projects/ledger-repo-abc123
                  repo_id:
                    type: integer
                    example: 42
                  created_at:
                    type: string
                    format: date-time
                    example: '2025-12-18T10:30:00Z'
                  message:
                    type: string
                    example: Ledger repository created successfully
        '400':
          description: Invalid repo_id format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GitLab integration not configured or creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
