                    - `auto`: normal channel/rollout resolution.

                    - `pinned`: resolver consults `device_firmware_target` for the served release.

                    - `disabled`: resolver returns 204 unconditionally (self-managed).

                    Resolver precedence: `disabled` > `pinned` > `auto`.

                    '
                reason:
                  type: string
                  description: Human-readable justification (e.g. 'eng rig - manual flashing').
                  maxLength: 512
