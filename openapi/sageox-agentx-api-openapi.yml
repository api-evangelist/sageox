  /api/v1/agentx/{app_id}/commands:
    get:
      operationId: agentxCommands
      summary: Get command usage ranking
      description: 'Returns the top 50 commands by usage count with percentage distribution.

        Command names are extracted from `properties->>''command''` in events.

        '
      tags:
      - AgentX
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D/get/parameters/0'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/1'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/2'
      responses:
        '200':
          description: Command distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1agents/get/responses/200/content/application~1json/schema/items'
  /api/v1/agentx/{app_id}/agents:
    get:
      operationId: agentxAgents
      summary: Get agent type distribution
      description: 'Returns event counts grouped by actor and agent type.

        Labels are formatted as `{actor}/{agent_type}` (e.g., `agent/copilot`).

        '
      tags:
      - AgentX
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D/get/parameters/0'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/1'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/2'
      responses:
        '200':
          description: Agent distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: Category label (command name, agent type, etc.)
                    count:
                      type: integer
                      format: int64
                    pct:
                      type: number
                      format: double
                      description: Percentage of total (0–100)
  /api/v1/agentx/{app_id}/versions:
    get:
      operationId: agentxVersions
      summary: Get version adoption data
      description: 'Returns daily event counts grouped by client library version

        (`properties->>''$lib_version''`). Useful for tracking version adoption curves.

        '
      tags:
      - AgentX
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D/get/parameters/0'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/1'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/2'
      responses:
        '200':
          description: Version time series (daily buckets)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/responses/200/content/application~1json/schema/items'
  /api/v1/agentx/{app_id}/users:
    get:
      operationId: agentxUsers
      summary: Get daily active users
      description: 'Returns daily active user counts. Users are identified by

        `COALESCE(properties->>''$user_id'', distinct_id)`.

        '
      tags:
      - AgentX
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D/get/parameters/0'
      - in: query
        name: start_date
        schema:
          type: string
          format: date
          example: '2026-03-19'
        description: Start of date range (ISO 8601 date or datetime). Defaults to 7 days ago.
      - in: query
        name: end_date
        schema:
          type: string
          format: date
          example: '2026-03-26'
        description: End of date range (ISO 8601 date or datetime). Defaults to now.
      responses:
        '200':
          description: DAU time series
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bucket:
                      type: string
                      description: Time bucket (RFC 3339 for hourly, `YYYY-MM-DD` for daily)
                      example: '2026-03-26T14:00:00Z'
                    count:
                      type: integer
                      format: int64
                    event:
                      type: string
                      description: Event name or version string (present when grouped by event/version)
  /api/v1/agentx/{app_id}/export:
    get:
      operationId: agentxExport
      summary: Export friction events as CSV
      description: 'Streams all friction events for the date range as a CSV download.


        **Columns:** `ts`, `event`, `distinct_id`, `kind`, `actor`, `agent_type`,

        `command`, `subcommand`, `input`, `error_msg`, `suggestion`, `lib_version`,

        `path_bucket`, `user_id`.

        '
      tags:
      - AgentX
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D/get/parameters/0'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/1'
      - $ref: '#/paths/~1api~1v1~1agentx~1%7Bapp_id%7D~1users/get/parameters/2'
      responses:
        '200':
          description: CSV file download
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename=agentx-friction-app_01234.csv
          content:
            text/csv:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from the auth service (/api/auth/token).

        Token is validated using JWKS from the auth service.

        Required claims: sub (user_id), email, name, tier.

        '
