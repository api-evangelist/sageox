  /api/v1/recordings/{rec_id}/reactions:
    get:
      operationId: listRecordingReactions
      summary: List recording reactions
      description: 'Every reaction (live-meeting emoji) recorded against this recording, in

        chronological (oldest-first) order. Unbounded by design — recording

        reactions are retained indefinitely as transcript-timeline metadata.

        The UI is responsible for bucketing or windowing on render.

        '
      tags:
      - Recordings
      security:
      - BearerAuth: []
      parameters:
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
          example: rec_01934f5a-8b9c-7def-b012-3456789abcde
      responses:
        '200':
          description: Reactions retrieved (possibly empty list)
          content:
            application/json:
              schema:
                type: object
                required:
                - reactions
                properties:
                  reactions:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - recordingId
                      - userId
                      - emoji
                      - createdAt
                      - metadata
                      properties:
                        id:
                          type: string
                          description: Reaction UUID
                          example: 01935a7b-1234-7abc-9def-0123456789ab
                        recordingId:
                          type: string
                          description: Recording the reaction belongs to (rec_<uuidv7>)
                          example: rec_01934f5a-8b9c-7def-b012-3456789abcde
                        userId:
                          type: string
                          description: User who reacted (usr_<id>)
                          example: usr_abc123xyz
                        emoji:
                          type: string
                          description: Reaction emoji (UTF-8, ≤16 bytes)
                          example: 🎉
                        createdAt:
                          type: string
                          format: date-time
                          example: '2026-05-01T12:00:00Z'
                        metadata:
                          type: object
                          description: Client-side context (skin tone, origin point, etc.)
        '400':
          description: Invalid rec_id format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — caller is not a member of the recording's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, or recording is not team-scoped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
