  /api/v1/repos/{repo_id}/recordings/{rec_id}/complete:
    post:
      operationId: completeRecordingRepo
      summary: Complete recording upload (repo-scoped)
      description: 'Finalize the recording after all chunks are uploaded. Updates recording

        status to "processing" and starts the Temporal workflow for transcription,

        summarization, and commit to ledger.


        **Status transition:** pending/uploading → processing → ready

        '
      tags:
      - Recordings
      security:
      - BearerAuth: []
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^repo_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
          example: rec_01934f5a-8b9c-7def-b012-3456789abcde
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chunk_count
              properties:
                chunk_count:
                  type: integer
                  minimum: 1
                  description: Total number of chunks uploaded
                  example: 12
                total_size:
                  type: integer
                  format: int64
                  description: Total size in bytes across all chunks
                  example: 3145728
                duration:
                  type: number
                  format: double
                  description: Actual recording duration in seconds
                  example: 1847.5
                checksum:
                  type: string
                  description: Optional integrity checksum (e.g., SHA-256)
                  example: sha256:a1b2c3d4e5f6...
      responses:
        '200':
          description: Recording completed and processing started
          content:
            application/json:
              schema:
                type: object
                required:
                - recording_id
                - status
                - completed_at
                properties:
                  recording_id:
                    type: string
                    example: rec_01934f5a-8b9c-7def-b012-3456789abcde
                  status:
                    type: string
                    enum:
                    - processing
                    example: processing
                  playback_url:
                    type: string
                    description: URL for playback (once ready)
                    example: https://sageox.ai/recordings/rec_01934f5a-8b9c-7def-b012-3456789abcde
                  completed_at:
                    type: string
                    format: date-time
                    example: '2025-01-30T14:45:30Z'
        '400':
          description: Invalid request (missing chunk_count, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Recording in invalid state for completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/repos/{repo_id}/recordings/{rec_id}/force-complete:
    post:
      operationId: forceCompleteRecordingRepo
      summary: Force-complete stuck recording (repo-scoped)
      description: 'Escape hatch for recordings stuck in pending/uploading state when the normal

        complete flow fails (network issues, API restart).


        **What this does:**

        1. Validates recording is in stuck state (pending or uploading)

        2. Updates status to processing

        3. Sends force_complete signal to session workflow

        4. Starts processing workflow directly as fallback


        Use this sparingly - only when normal completion fails.

        '
      tags:
      - Recordings
      security:
      - BearerAuth: []
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^repo_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
          example: rec_01934f5a-8b9c-7def-b012-3456789abcde
      responses:
        '200':
          description: Recording force-completed
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1repos~1%7Brepo_id%7D~1recordings~1%7Brec_id%7D/get/responses/200/content/application~1json/schema'
        '400':
          description: Invalid recording ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Recording not in stuck state (pending/uploading)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/repos/{repo_id}/recordings/{rec_id}/transcript:
    get:
      operationId: getTranscriptRepo
      summary: Get transcript (repo-scoped)
      description: 'Retrieve VTT (WebVTT) formatted transcript from the git ledger.

        Returns the raw VTT content with proper Content-Type header.


        **VTT format example:**

        ```

        WEBVTT


        00:00:00.000 --> 00:00:05.123

        Speaker A: This is the opening statement.


        00:00:05.123 --> 00:00:12.456

        Speaker B: And this is the response.

        ```

        '
      tags:
      - Recordings
      security:
      - BearerAuth: []
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^repo_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
          example: rec_01934f5a-8b9c-7def-b012-3456789abcde
      responses:
        '200':
          description: Transcript retrieved as VTT text
          content:
            text/vtt:
              schema:
                type: string
                format: binary
                description: WebVTT format transcript
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording or transcript not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/repos/{repo_id}/recordings/{rec_id}/decisions:
    get:
      operationId: getDecisionsRepo
      summary: Get extracted decisions (repo-scoped)
      description: 'Retrieve decisions extracted from the recording by the AI analysis workflow.

        Includes decision makers, behavioral patterns, and agreement status.


        **Decisions contain:**

        - Category, significance, status, title, description

        - Per-person agreement tracking

        - Supporting transcript evidence

        - Decision maker influence analysis

        - Behavioral pattern detection

        '
      tags:
      - Recordings
      security:
      - BearerAuth: []
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^repo_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
          example: rec_01934f5a-8b9c-7def-b012-3456789abcde
      responses:
        '200':
          description: Decisions retrieved
          content:
            application/json:
              schema:
                type: object
                required:
                - recording_id
                - decisions
                properties:
                  recording_id:
                    type: string
                    example: rec_01934f5a-8b9c-7def-b012-3456789abcde
                  extracted_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When decisions were extracted
                  participants_detected:
                    type: array
                    items:
                      type: string
                    description: Identified participants
                    example:
                    - Alice Chen
                    - Bob Wilson
                    - Charlie Davis
                  decision_makers:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          description: Participant name
                          example: Alice Chen
                        influence_score:
                          type: number
                          format: double
                          description: Influence score from 0-1
                          example: 0.85
                        influence_markers:
                          type: array
                          items:
                            type: string
                          description: Behavioral indicators of influence
                          example:
                          - frequently-speaks
                          - drives-conclusions
                          - steers-discussion
                    description: Decision influencers and their analysis
                  decisions:
                    type: array
                    items:
                      type: object
                      required:
                      - category
                      - significance
                      - status
                      - title
                      - description
                      - decision
                      properties:
                        category:
                          type: string
                          description: Decision category
                          example: technical-architecture
                        significance:
                          type: integer
                          minimum: 1
                          maximum: 5
                          description: Significance level (1=Critical, 5=Trivial)
                          example: 2
                        status:
                          type: string
                          description: Agreement status
                          example: agreed
                        title:
                          type: string
                          maxLength: 255
                          description: Short decision description (3-8 words)
                          example: Adopt microservices architecture
                        description:
                          type: string
                          description: Full context about the decision
                          example: Team agreed to migrate from monolith to microservices...
                        decision:
                          type: string
                          description: The actual decision or "No decision reached"
                          example: Use Kubernetes for orchestration
                        agreements:
                          type: object
                          additionalProperties:
                            type: string
                          description: Per-person agreement status
                          example:
                            Alice: agreed
                            Bob: needs-clarification
                        notes:
                          type: string
                          description: Supporting evidence from transcript
                    description: Extracted decisions
                  behavioral_patterns:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - description
                      properties:
                        type:
                          type: string
                          description: Pattern type
                          example: hedged-language
                        description:
                          type: string
                          description: What was observed
                          example: Used phrases like "maybe" and "sort of" when stating opinions
                        participants:
                          type: array
                          items:
                            type: string
                          description: Participants involved
                          example:
                          - Bob
                          - Charlie
                        evidence:
                          type: string
                          description: Supporting transcript excerpt
                    description: Detected patterns in discussion
                  provider:
                    type: string
                    nullable: true
                    description: LLM provider used for extraction
                    example: openai
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
