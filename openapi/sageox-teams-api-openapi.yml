        '200':
          description: Deletion initiated
          content:
            application/json:
              schema:
                type: object
                required:
                - team_id
                - status
                - status_url
                - expires_at
                properties:
                  team_id:
                    type: string
                    example: team_abc123xyz
                  status:
                    type: string
                    enum:
                    - pending
                    example: pending
                  status_url:
                    type: string
                    format: uri
                    description: URL to check deletion status
                    example: /api/v1/teams/team_abc123xyz/delete
                  expires_at:
                    type: string
                    format: date-time
                    description: Estimated expiration (authoritative value in workflow)
                    example: '2025-12-10T14:30:00Z'
                  workflow_id:
                    type: string
                    description: Temporal workflow ID for tracking
                    example: team-deletion-requested-team_abc123xyz
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions (requires owner role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getTeamDeletionStatus
      summary: Get team deletion status
      description: Checks the current status of a team deletion request.
      tags:
      - Teams
      security:
      - BearerAuth: []
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^team_[a-z0-9]{10}$
        example: team_abc123xyz
      responses:
        '200':
          description: Deletion status
          content:
            application/json:
              schema:
                type: object
                required:
                - team_id
                - status
                - initiated_by
                - initiated_at
                - expires_at
                properties:
                  team_id:
                    type: string
                    example: team_abc123xyz
                  status:
                    type: string
                    enum:
                    - pending
                    - confirmed
                    - canceled
                    - expired
                    - completed
                    example: pending
                  initiated_by:
                    type: string
                    description: User ID who initiated deletion
                    example: user_owner123
                  initiated_at:
                    type: string
                    format: date-time
                    example: '2025-12-03T14:30:00Z'
                  expires_at:
                    type: string
                    format: date-time
                    example: '2025-12-10T14:30:00Z'
                  confirmed_by:
                    type: string
                    nullable: true
                    description: User ID who confirmed deletion
                    example: null
                  confirmed_at:
                    type: string
                    format: date-time
                    nullable: true
                    example: null
                  workflow_id:
                    type: string
                    example: team-deletion-requested-team_abc123xyz
                  confirmation_required:
                    type: string
                    description: Text that must be typed to confirm (only when status is pending)
                    example: team_abc123xyz
        '401':
          description: Authentication required
          content:
            application/json:
