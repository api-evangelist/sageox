                - entities
                - total
                properties:
                  team_id:
                    type: string
                    example: team_abc123xyz
                  entities:
                    type: array
                    items:
                      type: object
                      required:
                      - resource_id
                      - resource_title
                      - resource_type
                      - category
                      properties:
                        resource_id:
                          type: string
                          example: repo_012345
                        resource_title:
                          type: string
